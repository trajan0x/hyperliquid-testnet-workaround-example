[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Deterministic bytecode: the factory must have byte-identical initcode on
# testnet and mainnet so it lands at the same CREATE2 address on both.
bytecode_hash = "none"
cbor_metadata = false

[rpc_endpoints]
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
hyperevm_mainnet = "https://rpc.hyperliquid.xyz/evm"

[lint]
lint_on_build = false
